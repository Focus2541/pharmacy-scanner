<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f43">
<title>แดชบอร์ด คลังใน</title>
<!-- ไฟล์นี้สร้างจาก dashboard.html สำหรับเปิดในชีต (เมนู คลังใน → เปิดแดชบอร์ด) -->
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar (desktop) + main grid of panels. Data from Apps Script ?a=dash, refreshed every 5 minutes. */
:root{
  --bg:#eef3f1;--surface:#fff;--ink:#15302b;--muted:#5d7470;--line:#e1e9e6;--accent:#0f7a68;--accent2:#14a088;--soft:#e0f1ec;
  --red:#c2362f;--red-soft:#fde8e6;--orange:#c46a0c;--orange-soft:#fdf0de;--amber:#b7791f;--amber-soft:#fdf5df;--blue:#2d6cdf;--blue-soft:#e6efff;--violet:#6d4fd8;--violet-soft:#efeafe;
  --side:#0b4f43;--side2:#06372f;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:#e6f4f0;padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:6px}
.brand img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.brand b{font:700 1.25rem var(--display)}
.brand span{font-size:.82rem;opacity:.8}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-weight:500;opacity:.88}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a.on{background:#fff;color:var(--side);opacity:1;font-weight:600}
.side .foot{margin-top:auto;font-size:.8rem;opacity:.75;line-height:1.6;padding:0 6px}
.side .foot b{display:block;font:600 .95rem var(--display);opacity:1;color:#bfe9de}
/* main */
main{padding:18px 26px 40px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 14px;margin-bottom:18px;box-shadow:0 1px 0 var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.crumb i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
.tright{display:flex;gap:8px;align-items:center}
.datep{gap:2px;padding:3px 6px}.datep input{border:0;background:transparent;font:inherit;font-size:.9rem;color:var(--ink);padding:3px 2px;cursor:pointer;min-width:0}
.datep button{border:0;background:none;font:600 1.1rem var(--body);color:var(--muted);cursor:pointer;padding:0 6px;border-radius:8px}.datep button:hover:not(:disabled){background:var(--soft);color:var(--accent)}.datep button:disabled{opacity:.3;cursor:default}
.datep:focus-within{border-color:var(--accent)}
.past{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:14px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
button.pill{cursor:pointer;font:inherit;font-size:.85rem}
button.pill:hover{border-color:var(--accent);color:var(--accent)}
h1{font:700 1.65rem/1.25 var(--display);margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 14px}
.demo{background:var(--orange-soft);color:var(--orange);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.kpi .ic svg{width:22px;height:22px}
.kpi .l{font-size:.82rem;font-weight:600;line-height:1.3}
.kpi .v{font:700 1.9rem/1.1 var(--display)}
.kpi .v small{font:500 .8rem var(--body);margin-left:4px}
.kpi .x{font-size:.75rem;opacity:.85;margin-top:2px}
.k1{background:linear-gradient(135deg,#e3f5ef,#cdeee4);color:var(--accent)} .k1 .ic{background:var(--accent)}
.k2{background:var(--red-soft);color:var(--red)} .k2 .ic{background:var(--red)}
.k3{background:var(--orange-soft);color:var(--orange)} .k3 .ic{background:#e08a1e}
.k4{background:var(--amber-soft);color:var(--amber)} .k4 .ic{background:#d9a227}
.k5{background:var(--blue-soft);color:var(--blue)} .k5 .ic{background:var(--blue)}
.k6{background:var(--violet-soft);color:var(--violet)} .k6 .ic{background:var(--violet)}
.kpi.zero{filter:saturate(.25);opacity:.75}
/* panels */
.row{display:grid;gap:14px;margin-bottom:14px}
.r3{grid-template-columns:1.35fr 1.15fr .7fr}
.r2{grid-template-columns:1fr 1.25fr}
.r2b{grid-template-columns:1fr 1.3fr}
.panel{background:var(--surface);border-radius:16px;padding:14px 16px;min-width:0;box-shadow:0 1px 0 var(--line)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph svg{width:18px;height:18px;color:var(--accent);flex:none}
.ph h2{font:700 1rem var(--display);margin:0}
.ph .n{margin-left:auto;font-size:.78rem;color:var(--muted)}
.scroll{max-height:330px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{position:sticky;top:0;background:var(--surface);text-align:left;color:var(--muted);font-weight:600;font-size:.76rem;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid #f0f4f3;vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.i{color:var(--muted);width:28px}
td.d{white-space:nowrap}
td .en{display:block;font-size:.72rem;color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.74rem;font-weight:600;white-space:nowrap}
.t-ok{background:var(--soft);color:var(--accent)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-or{background:var(--orange-soft);color:var(--orange)}
.t-am{background:var(--amber-soft);color:var(--amber)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
/* weekday list */
.week{display:flex;flex-direction:column;gap:6px}
.week div{display:flex;justify-content:space-between;background:#f3f7f6;border-radius:10px;padding:8px 12px;font-weight:500}
.week div.today{background:var(--soft);color:var(--accent);font-weight:600}
.week b{font-variant-numeric:tabular-nums}
/* top bars */
.bars td.bar{width:42%}
.bars .track{height:10px;border-radius:999px;background:#edf3f1;overflow:hidden}
.bars .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* column chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:300px;padding:14px 4px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .v{font-size:.78rem;font-weight:600;margin-bottom:3px}
.col .b{width:72%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:2px}
.col.today .b{background:linear-gradient(180deg,#26c4a5,#0b6a5a)}
.xl{display:flex;gap:8px;padding:5px 4px 0}
.xl span{flex:1;text-align:center;font-size:.74rem;color:var(--muted);min-width:0;line-height:1.25}
.xl em{font-style:normal;font-size:.68rem}
.err{background:var(--red-soft);color:var(--red);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.skel{color:var(--muted);padding:40px;text-align:center}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.r3{grid-template-columns:1fr 1fr}.r3 .wk{grid-column:1/-1}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:10px;overflow-x:auto}
  .brand{flex-direction:row;padding:0;text-align:left}.brand img{width:34px;height:34px;border-radius:9px}.brand span,.side .foot{display:none}
  .nav{flex-direction:row}.nav a{padding:8px 10px;white-space:nowrap}
  main{padding:14px 16px 30px}
  .kpis{grid-template-columns:repeat(2,1fr)}.r3,.r2,.r2b{grid-template-columns:1fr}
  .topbar .crumb{display:none}
  .brand b{white-space:nowrap}.brand div br{display:none}
  td .en,td.i,th.i{display:none}
.chart{gap:4px}.col .v{font-size:.68rem}
  table{font-size:.8rem}
}
@media print{.side,.topbar{display:none}.app{grid-template-columns:1fr}body{background:#fff}.scroll{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="https://focus2541.github.io/pharmacy-scanner/stock/icons/icon.svg" alt=""><div><b>คลังใน</b><br><span id="sFac">รพ.สต.บ้านเป้า</span></div></div>
    <nav class="nav">
      <a href="https://focus2541.github.io/pharmacy-scanner/stock/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>หน้าคลัง</a>
      <a href="#" target="_self" class="on" onclick="return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>แดชบอร์ด</a>
      <a href="https://focus2541.github.io/pharmacy-scanner/stock/requisition.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>ใบเบิก</a>
    </nav>
    <div class="foot"><b>หยิบแล้วสแกนทุกครั้ง</b>ยอดในหน้านี้ตรงกับของจริงเมื่อทุกคนสแกน</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumb"><i></i><span id="crumb">คลังใน รพ.สต.บ้านเป้า</span></div>
      <div class="tright"><div class="pill datep" title="เลือกวันที่เพื่อดูย้อนหลัง"><button id="prev" aria-label="วันก่อนหน้า">‹</button><span class="cal">📅</span><input type="date" id="pick" aria-label="เลือกวันที่"><button id="next" aria-label="วันถัดไป">›</button></div><button class="pill" id="back" hidden>กลับมาวันนี้</button><button class="pill" id="reload" title="โหลดใหม่">↻ รีเฟรช</button></div>
    </div>
    <h1 id="title">แดชบอร์ดคลังยา</h1>
    <div class="sub" id="sub">กำลังโหลด…</div>
    <div class="err" id="err" hidden></div>
    <div class="past" id="pastBox" hidden></div>
    <div class="demo" id="demo" hidden>ตัวอย่าง: ตัวเลขในหน้านี้เป็นข้อมูลสมมุติ จะเปลี่ยนเป็นยอดจริงเองเมื่อรับเข้ายาครั้งแรกในแอป</div>
    <div id="body"><div class="skel">กำลังโหลดข้อมูล…</div></div>
  </main>
</div>
<script>
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('th-TH');
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=iso=>{if(!iso)return '-';const [y,m,d]=iso.slice(0,10).split('-').map(Number);return `${d} ${TH_M[m-1]} ${String(y+543).slice(2)}`};
const I={
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V5a2 2 0 0 1 4 0v5"/><path d="M11 10V4a2 2 0 0 1 4 0v6"/><path d="M15 10V6a2 2 0 0 1 4 0v8a7 7 0 0 1-14 0v-2a2 2 0 0 1 4 0"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
};
function kpi(cls,icon,label,v,unit,extra){return `<div class="kpi ${cls}${v?'':' zero'}"><div class="ic">${icon}</div><div><div class="l">${label}</div><div class="v">${fmt(v)}<small>${unit}</small></div>${extra?`<div class="x">${extra}</div>`:''}</div></div>`}
function panel(icon,title,n,inner,cls=''){return `<section class="panel ${cls}"><div class="ph">${icon}<h2>${title}</h2>${n!=null?`<span class="n">${n}</span>`:''}</div>${inner}</section>`}
const stTag={'ปกติ':'t-ok','ใกล้หมด':'t-am','ใกล้หมดอายุ':'t-or','หมดอายุ':'t-red'};
const short=n=>String(n||'').replace(/\s*·\s*(กล่อง|กระปุก|ห่อ|ขวด)ละ.*$/,'');
let sel='';   // วันที่เลือกดูย้อนหลัง ('' = วันนี้)
function localISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function render(D){
  $('body').style.opacity=1;
  ['stock','low','exp'].forEach(k=>D[k].forEach(x=>x.name=short(x.name)));D.top.forEach(x=>x[0]=short(x[0]));D.recent.forEach(r=>r[2]=short(r[2]));
  const fac=D.facility||'';
  $('sFac').textContent=fac;$('crumb').textContent='คลังใน '+fac;$('title').textContent='แดชบอร์ดคลังยา '+fac;
  const at=new Date(D.at);
  $('sub').textContent=D.past?`ข้อมูลย้อนหลัง ณ สิ้นวันที่ ${thDate(D.date)}`:`ข้อมูล ณ ${thDate(D.today)} เวลา ${at.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น. · อัปเดตอัตโนมัติทุก 5 นาที`;
  $('pastBox').hidden=!D.past;$('pastBox').textContent=D.past?`กำลังดูข้อมูลย้อนหลัง: ยอดคงเหลือและรายการ ณ สิ้นวันที่ ${thDate(D.date)} · กด "กลับมาวันนี้" เพื่อดูยอดปัจจุบัน`:'';
  $('back').hidden=!D.past;  const pk=$('pick');pk.max=localISO();if(D.first)pk.min=D.first;pk.value=D.date;$('next').disabled=!D.past;$('prev').disabled=!!(D.first&&D.date<=D.first);
  $('demo').hidden=!D.demo;
  const K=D.kpi;
  const kp=`<div class="kpis">
    ${kpi('k1',I.box,'ยาที่มีของในคลัง',K.stocked,'รายการ',`มูลค่าประมาณ ${fmt(Math.round(K.value))} บาท`)}
    ${kpi('k2',I.warn,'หมดอายุแล้ว',K.expired,'ล็อต',K.expired?'แยกออกจากชั้นแล้วตัดจำหน่าย':'')}
    ${kpi('k3',I.clock,'หมดอายุใน 3 เดือน',K.exp90,'ล็อต','')}
    ${kpi('k4',I.cal,'หมดอายุใน 4–6 เดือน',K.exp180,'ล็อต','')}
    ${kpi('k5',I.down,'ใกล้หมด / หมด',K.low,'รายการ',K.low?'ถึงจุดสั่งซื้อแล้ว':'')}
    ${kpi('k6',I.hand,D.past?'หยิบวันนั้น':'หยิบวันนี้',K.takesToday,'ครั้ง','')}</div>`;
  const stock=D.stock.length?`<div class="scroll"><table><tr><th class="i">#</th><th>ยา</th><th class="num">คงเหลือ</th><th>หมดอายุเร็วสุด</th><th>สถานะ</th></tr>${D.stock.map((x,i)=>`<tr><td class="i">${i+1}</td><td>${esc(x.name)}<span class="en">${esc(x.en)}</span></td><td class="num">${fmt(x.b)} ${esc(x.u)}</td><td class="d">${thDate(x.exp)}</td><td><span class="tag ${stTag[x.st]}">${x.st}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">ยังไม่มียาในคลัง</div>';
  const low=D.low.length?`<div class="scroll"><table><tr><th class="i">#</th><th>ยา</th><th class="num">คงเหลือ</th><th class="num">จุดสั่งซื้อ</th><th>สถานะ</th></tr>${D.low.map((x,i)=>`<tr><td class="i">${i+1}</td><td>${esc(x.name)}<span class="en">ใช้ 30 วัน: ${x.pm?fmt(x.pm)+' '+esc(x.u):'-'}</span></td><td class="num">${fmt(Math.max(0,x.b))} ${esc(x.u)}</td><td class="num">${x.min||'-'}</td><td><span class="tag ${x.b<=0?'t-red':'t-am'}">${x.b<=0?'หมด':'ใกล้หมด'}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">ยังไม่มียาที่ถึงจุดสั่งซื้อ</div>';
  const week=`<div class="week">${D.week.map((w,i)=>`<div class="${i===D.week.length-1?'today':''}"><span>${w[0]}${i===D.week.length-1?(D.past?' (วันที่เลือก)':' (วันนี้)'):''}</span><b>${w[1]}</b></div>`).join('')}</div>`;
  const tmax=D.top.length?D.top[0][1]:1;
  const top=D.top.length?`<table class="bars"><tr><th class="i">#</th><th>ยา</th><th class="num">จำนวน</th><th></th></tr>${D.top.map((x,i)=>`<tr><td class="i">${i+1}</td><td>${esc(x[0])}</td><td class="num">${fmt(x[1])} ${esc(x[2])}</td><td class="bar"><div class="track"><div class="fill" style="width:${Math.max(4,x[1]/tmax*100)}%"></div></div></td></tr>`).join('')}</table>`:'<div class="empty">ยังไม่มีการหยิบใน 30 วัน</div>';
  const dmax=Math.max(1,...D.daily.map(x=>x[1]));
  const chart=`<div class="chart">${D.daily.map((x,i)=>`<div class="col ${i===D.daily.length-1?'today':''}"><span class="v">${x[1]}</span><div class="b" style="height:${x[1]/dmax*82}%"></div></div>`).join('')}</div><div class="xl">${D.daily.map((x,i)=>{const [dd,mm]=x[0].split('/').map(Number);return `<span>${dd}${i===0||dd===1?`<br><em>${TH_M[mm-1]}</em>`:''}</span>`}).join('')}</div>`;
  const exp=D.exp.length?`<div class="scroll"><table><tr><th>ยา</th><th>วันหมดอายุ</th><th class="num">เหลือ</th><th>สถานะ</th></tr>${D.exp.map(x=>`<tr><td>${esc(x.name)}</td><td class="d">${thDate(x.exp)}</td><td class="num">${fmt(x.q)} ${esc(x.u)}</td><td><span class="tag ${x.d<0?'t-red':x.d<=90?'t-or':'t-am'}">${x.d<0?'หมดอายุแล้ว':x.d<=90?`อีก ${x.d} วัน`:`อีก ${Math.round(x.d/30)} เดือน`}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">ไม่มียาหมดอายุภายใน 6 เดือน</div>';
  const recent=D.recent.length?`<div class="scroll"><table><tr><th>เวลา</th><th>ประเภท</th><th>ยา</th><th class="num">จำนวน</th><th>ผู้ทำ</th></tr>${D.recent.map(r=>{const t=new Date(r[0]);return `<tr><td style="white-space:nowrap">${t.getDate()} ${TH_M[t.getMonth()]} ${t.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</td><td><span class="tag ${r[1]==='หยิบ'?'t-ok':r[1]==='รับเข้า'?'t-am':r[1]==='ตัดจำหน่าย'?'t-red':'t-or'}">${esc(r[1])}</span></td><td>${esc(r[2])}${r[5]?`<span class="en">${esc(r[5])}</span>`:''}</td><td class="num">${fmt(r[3])} ${esc(r[6]||'')}</td><td>${esc(r[4]||'-')}</td></tr>`}).join('')}</table></div>`:'<div class="empty">ยังไม่มีรายการ</div>';
  const who=D.people.length?D.people.map(p=>`<span class="tag t-ok" style="margin:2px">${esc(p[0])} · ${p[1]}</span>`).join(''):'';
  $('body').innerHTML=kp+
    `<div class="row r3">${panel(I.box,'ยาที่มีในคลัง (ยอดคงเหลือ)',`${D.stock.length} รายการ`,stock)}${panel(I.down,'ยาใกล้หมด / หมด',`${D.low.length} รายการ`,low)}${panel(I.cal,'จำนวนครั้งที่หยิบใน 7 วัน',null,week+(who?`<div style="margin-top:10px;font-size:.78rem;color:var(--muted)">ใครหยิบ 7 วัน</div><div>${who}</div>`:''),'wk')}</div>`+
    `<div class="row r2">${panel(I.chart,'ยอดใช้ยาในช่วง 30 วัน',null,top)}${panel(I.chart,'จำนวนครั้งที่หยิบใน 14 วันล่าสุด',null,chart)}</div>`+
    `<div class="row r2b">${panel(I.clock,'ยาใกล้หมดอายุ (6 เดือน)',`${D.exp.length} ล็อต`,exp)}${panel(I.list,'รายการล่าสุด',null,recent)}</div>`;
}
/* ในชีต: ดึงข้อมูลผ่าน google.script.run ไม่ต้องขอสิทธิ์เครื่อง */
function load(){
  $('body').style.opacity=.5;
  google.script.run.withSuccessHandler(j=>{$('err').hidden=true;render(j)})
    .withFailureHandler(e=>{$('body').style.opacity=1;$('err').hidden=false;$('err').textContent='โหลดข้อมูลไม่ได้: '+(e&&e.message||e);if(!$('body').querySelector('.kpis'))$('body').innerHTML=''})
    .dashboardData(sel);
}
$('reload').onclick=()=>load();
const go=v=>{sel=(v&&v<localISO())?v:'';load()};
$('pick').onchange=e=>go(e.target.value);
$('pick').onclick=e=>{try{e.target.showPicker()}catch(_){}};   // เปิดปฏิทินเมื่อกดตรงไหนก็ได้ (ถ้าเบราว์เซอร์อนุญาต)
const shift=n=>{const d=new Date(($('pick').value||localISO())+'T12:00:00');d.setDate(d.getDate()+n);const v=d.toISOString().slice(0,10);if($('pick').min&&v<$('pick').min)return;go(v)};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('back').onclick=()=>{sel='';load()};
load();setInterval(()=>{if(!sel&&document.visibilityState==='visible')load()},5*60e3);
</script>
</body>
</html>
